<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="FandomVerse - The ultimate centralized cultural portal for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, and Manga fandoms." />
    <title>FandomVerse | Portal for Fandom World</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fandomverse_theme_v2') || localStorage.getItem('fandomverse_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-zinc-100 antialiased selection:bg-rose-500 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
