<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="50%" stop-color="#0a0b14" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Primary Brand Gradient (Rose to Purple to Cyan) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e74" />
      <stop offset="55%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ff2e74" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="3" y="3" width="114" height="114" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Light Reflection inside top -->
  <path d="M 12,30 C 12,18 20,10 32,8 L 88,8 C 100,10 108,18 108,30 C 80,36 40,36 12,30 Z" fill="white" opacity="0.04" />

  <!-- Background Dimensional Rings (Convergence of Multiverse) -->
  <ellipse cx="60" cy="60" rx="38" ry="24" transform="rotate(-28 60 60)" stroke="url(#accentGrad)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.4" />
  <ellipse cx="60" cy="60" rx="42" ry="20" transform="rotate(32 60 60)" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.35" />

  <!-- Central Stylized Fandom 'F' Monogram / Prism Portal -->
  <!-- Vertical Pillar of 'F' with 3D Bevel Facets -->
  <path d="M 36,30 C 36,26.5 38.5,24 42,24 L 52,24 C 55.5,24 58,26.5 58,30 L 58,88 C 58,91.5 55.5,94 52,94 L 42,94 C 38.5,94 36,91.5 36,88 Z" fill="url(#brandGrad)" filter="url(#glowFilter)" />

  <!-- Upper Wing of 'F' -->
  <path d="M 52,24 L 84,24 C 88,24 90,26.5 88.5,30 L 83,40 C 81.5,42.5 78.5,44 75,44 L 52,44 Z" fill="url(#brandGrad)" />

  <!-- Inner Shading Highlight for 3D depth -->
  <path d="M 42,24 L 78,24 C 81,24 82,25.5 80.5,28 L 76,36 C 74.5,38 72.5,39 70,39 L 46,39 Z" fill="#ffffff" opacity="0.28" />

  <!-- Mid Wing of 'F' with Kinetic Arrow / Energy Bolt Pointing Forward -->
  <path d="M 52,50 L 76,50 C 79.5,50 82,52 83.5,55 L 85.5,59 C 86.8,61.5 85,64 82,64 L 52,64 Z" fill="url(#accentGrad)" />

  <!-- Central Multi-culture Core Sparkle (Nexus Point) -->
  <g transform="translate(68, 57)">
    <circle cx="0" cy="0" r="4.5" fill="#00f0ff" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
    <path d="M 0,-9 L 2,-3 L 8,0 L 2,3 L 0,9 L -2,3 L -8,0 L -2,-3 Z" fill="#00f0ff" opacity="0.9" />
  </g>

  <!-- Small Starlight Sparkles in Orbit -->
  <path d="M 92,26 L 93.5,30 L 97.5,31.5 L 93.5,33 L 92,37 L 90.5,33 L 86.5,31.5 L 90.5,30 Z" fill="#ff2e74" opacity="0.85" />
  <circle cx="28" cy="46" r="1.8" fill="#c084fc" opacity="0.8" />
  <circle cx="88" cy="80" r="2" fill="#00f0ff" opacity="0.75" />
  <circle cx="34" cy="82" r="1.5" fill="#ff2e74" opacity="0.7" />
</svg>
